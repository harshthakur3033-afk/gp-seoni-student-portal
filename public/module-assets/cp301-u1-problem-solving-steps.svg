<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" rx="26" fill="#f8fbff"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#14213d">Steps Involved in Problem Solving</text>
<text x="600" y="78" text-anchor="middle" font-family="Arial" font-size="15" fill="#60748f">A systematic path from understanding the problem to an improved working solution.</text>
<path d="M125 170 H1075" stroke="#b7c9df" stroke-width="5" stroke-linecap="round"/>
<g transform="translate(70,115)">
<circle cx="55" cy="55" r="40" fill="#2b69d3"/><text x="55" y="63" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">1</text>
<text x="55" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#14213d">Understand</text>
<text x="55" y="148" text-anchor="middle" font-family="Arial" font-size="11" fill="#60748f">Define the problem clearly</text>
</g><g transform="translate(245,115)">
<circle cx="55" cy="55" r="40" fill="#16a06b"/><text x="55" y="63" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">2</text>
<text x="55" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#14213d">Identify</text>
<text x="55" y="148" text-anchor="middle" font-family="Arial" font-size="11" fill="#60748f">Inputs and expected outputs</text>
</g><g transform="translate(420,115)">
<circle cx="55" cy="55" r="40" fill="#ef8b23"/><text x="55" y="63" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">3</text>
<text x="55" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#14213d">Break down</text>
<text x="55" y="148" text-anchor="middle" font-family="Arial" font-size="11" fill="#60748f">Divide into smaller parts</text>
</g><g transform="translate(595,115)">
<circle cx="55" cy="55" r="40" fill="#7b4fd6"/><text x="55" y="63" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">4</text>
<text x="55" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#14213d">Design</text>
<text x="55" y="148" text-anchor="middle" font-family="Arial" font-size="11" fill="#60748f">Algorithm / flowchart</text>
</g><g transform="translate(770,115)">
<circle cx="55" cy="55" r="40" fill="#d94a63"/><text x="55" y="63" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">5</text>
<text x="55" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#14213d">Implement</text>
<text x="55" y="148" text-anchor="middle" font-family="Arial" font-size="11" fill="#60748f">Write program code</text>
</g><g transform="translate(945,115)">
<circle cx="55" cy="55" r="40" fill="#0f8fa5"/><text x="55" y="63" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">6</text>
<text x="55" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#14213d">Test</text>
<text x="55" y="148" text-anchor="middle" font-family="Arial" font-size="11" fill="#60748f">Run and check results</text>
</g><g transform="translate(1120,115)">
<circle cx="55" cy="55" r="40" fill="#6c63a8"/><text x="55" y="63" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">7</text>
<text x="55" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#14213d">Improve</text>
<text x="55" y="148" text-anchor="middle" font-family="Arial" font-size="11" fill="#60748f">Fix errors and refine</text>
</g>
<rect x="70" y="220" width="1060" height="170" rx="18" fill="#fff" stroke="#dbe6f3" stroke-width="2"/>
<text x="600" y="254" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#14213d">Example: Find the total of two numbers</text>
<g transform="translate(105,290)">
<rect width="220" height="68" rx="13" fill="#edf5ff"/><text x="110" y="26" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#2b69d3">Input</text><text x="110" y="49" text-anchor="middle" font-family="Arial" font-size="13" fill="#30445f">A = 10, B = 20</text>
<path d="M220 34 H248" stroke="#8aa6c9" stroke-width="3"/><path d="M240 27 L249 34 L240 41" fill="none" stroke="#8aa6c9" stroke-width="2.5"/>
</g><g transform="translate(365,290)">
<rect width="220" height="68" rx="13" fill="#ecfaf4"/><text x="110" y="26" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#16a06b">Plan</text><text x="110" y="49" text-anchor="middle" font-family="Arial" font-size="13" fill="#30445f">We need addition</text>
<path d="M220 34 H248" stroke="#8aa6c9" stroke-width="3"/><path d="M240 27 L249 34 L240 41" fill="none" stroke="#8aa6c9" stroke-width="2.5"/>
</g><g transform="translate(625,290)">
<rect width="220" height="68" rx="13" fill="#fff4e8"/><text x="110" y="26" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#ef8b23">Process</text><text x="110" y="49" text-anchor="middle" font-family="Arial" font-size="13" fill="#30445f">SUM = A + B</text>
<path d="M220 34 H248" stroke="#8aa6c9" stroke-width="3"/><path d="M240 27 L249 34 L240 41" fill="none" stroke="#8aa6c9" stroke-width="2.5"/>
</g><g transform="translate(885,290)">
<rect width="220" height="68" rx="13" fill="#f5efff"/><text x="110" y="26" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#7b4fd6">Output</text><text x="110" y="49" text-anchor="middle" font-family="Arial" font-size="13" fill="#30445f">SUM = 30</text>

</g>
<rect x="70" y="425" width="1060" height="190" rx="18" fill="#ffffff" stroke="#dbe6f3" stroke-width="2"/>
<text x="95" y="462" font-family="Arial" font-size="20" font-weight="700" fill="#14213d">Why each step matters</text>
<g transform="translate(95,485)"><circle cx="8" cy="8" r="5" fill="#2b69d3"/><text x="23" y="12" font-family="Arial" font-size="12" font-weight="700" fill="#263650">Understand:</text><text x="105" y="12" font-family="Arial" font-size="11" fill="#60748f">Avoid solving the wrong problem.</text></g><g transform="translate(600,485)"><circle cx="8" cy="8" r="5" fill="#2b69d3"/><text x="23" y="12" font-family="Arial" font-size="12" font-weight="700" fill="#263650">Identify:</text><text x="105" y="12" font-family="Arial" font-size="11" fill="#60748f">Know exactly what information is needed.</text></g><g transform="translate(95,525)"><circle cx="8" cy="8" r="5" fill="#2b69d3"/><text x="23" y="12" font-family="Arial" font-size="12" font-weight="700" fill="#263650">Break down:</text><text x="105" y="12" font-family="Arial" font-size="11" fill="#60748f">Reduce complexity and make the task manageable.</text></g><g transform="translate(600,525)"><circle cx="8" cy="8" r="5" fill="#2b69d3"/><text x="23" y="12" font-family="Arial" font-size="12" font-weight="700" fill="#263650">Design:</text><text x="105" y="12" font-family="Arial" font-size="11" fill="#60748f">Create logic before writing code.</text></g><g transform="translate(95,565)"><circle cx="8" cy="8" r="5" fill="#2b69d3"/><text x="23" y="12" font-family="Arial" font-size="12" font-weight="700" fill="#263650">Implement + Test:</text><text x="105" y="12" font-family="Arial" font-size="11" fill="#60748f">Turn the plan into code and check whether it works.</text></g><g transform="translate(600,565)"><circle cx="8" cy="8" r="5" fill="#2b69d3"/><text x="23" y="12" font-family="Arial" font-size="12" font-weight="700" fill="#263650">Improve:</text><text x="105" y="12" font-family="Arial" font-size="11" fill="#60748f">Correct errors and make the solution better.</text></g>
</svg>