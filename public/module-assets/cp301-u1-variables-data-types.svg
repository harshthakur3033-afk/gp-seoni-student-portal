<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<rect width="1200" height="470" rx="24" fill="#fbfcff"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#14213d">Variables, Constants and Common C Data Types</text>
<g transform="translate(75,95)">
<rect width="320" height="270" rx="18" fill="#fff" stroke="#dce6f3" stroke-width="2"/>
<text x="160" y="42" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#1d5fc4">Variable</text>
<text x="24" y="82" font-family="Arial" font-size="16" fill="#263650">A named storage location</text>
<text x="24" y="112" font-family="Arial" font-size="16" fill="#263650">whose value can change.</text>
<rect x="24" y="150" width="272" height="78" rx="12" fill="#edf5ff"/><text x="40" y="182" font-family="Courier New" font-size="17" fill="#183b6b">int marks = 75;</text><text x="40" y="211" font-family="Arial" font-size="13" fill="#60748f">marks → variable, 75 → value</text>
</g>
<g transform="translate(440,95)">
<rect width="320" height="270" rx="18" fill="#fff" stroke="#dce6f3" stroke-width="2"/>
<text x="160" y="42" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#16a06b">Constant</text>
<text x="24" y="82" font-family="Arial" font-size="16" fill="#263650">A value intended not</text>
<text x="24" y="112" font-family="Arial" font-size="16" fill="#263650">to change during execution.</text>
<rect x="24" y="150" width="272" height="78" rx="12" fill="#ecfaf4"/><text x="40" y="182" font-family="Courier New" font-size="17" fill="#15684b">const int DAYS = 7;</text><text x="40" y="211" font-family="Arial" font-size="13" fill="#60748f">DAYS → symbolic constant</text>
</g>
<g transform="translate(805,95)">
<rect width="320" height="270" rx="18" fill="#fff" stroke="#dce6f3" stroke-width="2"/>
<text x="160" y="42" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#7b4fd6">Common Data Types</text>
<g transform="translate(24,70)"><rect width="272" height="32" rx="7" fill="#edf5ff"/><text x="12" y="22" font-family="Courier New" font-size="15" font-weight="700" fill="#263650">int</text><text x="120" y="22" font-family="Arial" font-size="13" fill="#60748f">integer</text></g><g transform="translate(24,112)"><rect width="272" height="32" rx="7" fill="#ecfaf4"/><text x="12" y="22" font-family="Courier New" font-size="15" font-weight="700" fill="#263650">char</text><text x="120" y="22" font-family="Arial" font-size="13" fill="#60748f">character</text></g><g transform="translate(24,154)"><rect width="272" height="32" rx="7" fill="#fff4e8"/><text x="12" y="22" font-family="Courier New" font-size="15" font-weight="700" fill="#263650">float</text><text x="120" y="22" font-family="Arial" font-size="13" fill="#60748f">floating-point</text></g><g transform="translate(24,196)"><rect width="272" height="32" rx="7" fill="#f5efff"/><text x="12" y="22" font-family="Courier New" font-size="15" font-weight="700" fill="#263650">double</text><text x="120" y="22" font-family="Arial" font-size="13" fill="#60748f">higher precision</text></g>
</g>
<text x="600" y="410" text-anchor="middle" font-family="Arial" font-size="15" fill="#526783">The data type tells the program what kind of value a variable stores and how that value is interpreted.</text>
</svg>