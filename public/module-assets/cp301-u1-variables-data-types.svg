<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="28" fill="#fbfcff"/>
<rect x="32" y="28" width="1136" height="82" rx="20" fill="#0b2a5b"/>
<text x="64" y="61" font-family="Arial" font-size="16" font-weight="700" fill="#a8cdfd">COMPUTER PROGRAMMING 301</text>
<text x="64" y="92" font-family="Arial" font-size="26" font-weight="700" fill="#fff">Variables, Constants, Data Types and Memory</text>

<g transform="translate(55,145)">
<rect width="350" height="210" rx="18" fill="#fff" stroke="#2b69d3" stroke-width="3"/>
<text x="175" y="42" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#1d5fc4">Variable</text>
<text x="24" y="76" font-family="Arial" font-size="13" fill="#60748f">A named storage location whose value may change.</text>
<rect x="24" y="104" width="302" height="70" rx="12" fill="#edf5ff"/>
<text x="175" y="136" text-anchor="middle" font-family="Courier New" font-size="18" font-weight="700" fill="#183b6b">int marks = 75;</text>
<text x="175" y="158" text-anchor="middle" font-family="Arial" font-size="11" fill="#60748f">marks = name, 75 = current value</text>
</g>

<g transform="translate(425,145)">
<rect width="350" height="210" rx="18" fill="#fff" stroke="#16a06b" stroke-width="3"/>
<text x="175" y="42" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#16a06b">Constant</text>
<text x="24" y="76" font-family="Arial" font-size="13" fill="#60748f">A value intended not to change during execution.</text>
<rect x="24" y="104" width="302" height="70" rx="12" fill="#ecfaf4"/>
<text x="175" y="136" text-anchor="middle" font-family="Courier New" font-size="18" font-weight="700" fill="#15684b">const int DAYS = 7;</text>
<text x="175" y="158" text-anchor="middle" font-family="Arial" font-size="11" fill="#60748f">The value is intended to stay fixed.</text>
</g>

<g transform="translate(795,145)">
<rect width="350" height="210" rx="18" fill="#fff" stroke="#7b4fd6" stroke-width="3"/>
<text x="175" y="42" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#7b4fd6">Memory Representation</text>
<text x="24" y="76" font-family="Arial" font-size="13" fill="#60748f">Information is stored in binary form in memory.</text>
<rect x="24" y="104" width="302" height="70" rx="12" fill="#f4efff"/>
<text x="175" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#60748f">marks</text>
<text x="175" y="151" text-anchor="middle" font-family="Courier New" font-size="16" font-weight="700" fill="#5d3bab">→ memory location → 75</text>
<text x="175" y="169" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#60748f">8 bits = 1 byte</text>
</g>

<text x="600" y="405" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#14213d">Common C Data Types</text>
<g transform="translate(55,438)">
<rect width="205" height="150" rx="15" fill="#fff" stroke="#2b69d3" stroke-width="2"/>
<rect width="205" height="42" rx="15" fill="#edf5ff"/><rect y="28" width="205" height="14" fill="#edf5ff"/>
<text x="102" y="28" text-anchor="middle" font-family="Courier New" font-size="17" font-weight="700" fill="#263650">int</text>
<text x="14" y="72" font-family="Arial" font-size="12" fill="#60748f">Integer values</text>
<rect x="14" y="91" width="177" height="38" rx="8" fill="#f7f9fc"/>
<text x="102" y="116" text-anchor="middle" font-family="Courier New" font-size="13" font-weight="700" fill="#30445f">75</text>
</g><g transform="translate(283,438)">
<rect width="205" height="150" rx="15" fill="#fff" stroke="#16a06b" stroke-width="2"/>
<rect width="205" height="42" rx="15" fill="#ecfaf4"/><rect y="28" width="205" height="14" fill="#ecfaf4"/>
<text x="102" y="28" text-anchor="middle" font-family="Courier New" font-size="17" font-weight="700" fill="#263650">char</text>
<text x="14" y="72" font-family="Arial" font-size="12" fill="#60748f">Character value</text>
<rect x="14" y="91" width="177" height="38" rx="8" fill="#f7f9fc"/>
<text x="102" y="116" text-anchor="middle" font-family="Courier New" font-size="13" font-weight="700" fill="#30445f">'A'</text>
</g><g transform="translate(511,438)">
<rect width="205" height="150" rx="15" fill="#fff" stroke="#ef8b23" stroke-width="2"/>
<rect width="205" height="42" rx="15" fill="#fff4e8"/><rect y="28" width="205" height="14" fill="#fff4e8"/>
<text x="102" y="28" text-anchor="middle" font-family="Courier New" font-size="17" font-weight="700" fill="#263650">float</text>
<text x="14" y="72" font-family="Arial" font-size="12" fill="#60748f">Floating-point value</text>
<rect x="14" y="91" width="177" height="38" rx="8" fill="#f7f9fc"/>
<text x="102" y="116" text-anchor="middle" font-family="Courier New" font-size="13" font-weight="700" fill="#30445f">3.14</text>
</g><g transform="translate(739,438)">
<rect width="205" height="150" rx="15" fill="#fff" stroke="#7b4fd6" stroke-width="2"/>
<rect width="205" height="42" rx="15" fill="#f5efff"/><rect y="28" width="205" height="14" fill="#f5efff"/>
<text x="102" y="28" text-anchor="middle" font-family="Courier New" font-size="17" font-weight="700" fill="#263650">double</text>
<text x="14" y="72" font-family="Arial" font-size="12" fill="#60748f">Double-precision value</text>
<rect x="14" y="91" width="177" height="38" rx="8" fill="#f7f9fc"/>
<text x="102" y="116" text-anchor="middle" font-family="Courier New" font-size="13" font-weight="700" fill="#30445f">3.141592</text>
</g><g transform="translate(967,438)">
<rect width="205" height="150" rx="15" fill="#fff" stroke="#d94a63" stroke-width="2"/>
<rect width="205" height="42" rx="15" fill="#ffecee"/><rect y="28" width="205" height="14" fill="#ffecee"/>
<text x="102" y="28" text-anchor="middle" font-family="Courier New" font-size="17" font-weight="700" fill="#263650">void</text>
<text x="14" y="72" font-family="Arial" font-size="12" fill="#60748f">Absence of a value/type</text>
<rect x="14" y="91" width="177" height="38" rx="8" fill="#f7f9fc"/>
<text x="102" y="116" text-anchor="middle" font-family="Courier New" font-size="13" font-weight="700" fill="#30445f">relevant contexts</text>
</g>
<rect x="175" y="610" width="850" height="44" rx="12" fill="#eef4ff"/>
<text x="600" y="638" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#315f99">Memory idea: variable name → memory location → stored value</text>
</svg>