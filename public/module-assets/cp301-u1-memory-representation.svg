<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<rect width="1200" height="430" rx="24" fill="#f8fbff"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#14213d">Memory Representation of a Variable</text>
<text x="600" y="83" text-anchor="middle" font-family="Arial" font-size="15" fill="#60748f">A variable has a name, a memory location and a stored value.</text>
<g transform="translate(70,130)">
<rect width="250" height="200" rx="18" fill="#fff" stroke="#2b69d3" stroke-width="3"/>
<text x="125" y="45" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1d5fc4">Variable</text>
<rect x="28" y="70" width="194" height="72" rx="10" fill="#edf5ff"/>
<text x="125" y="101" text-anchor="middle" font-family="Courier New" font-size="21" font-weight="700" fill="#183b6b">marks</text>
<text x="125" y="128" text-anchor="middle" font-family="Arial" font-size="13" fill="#60748f">name used in the program</text>
</g>
<path d="M320 230 H420" stroke="#8aa6c9" stroke-width="6" stroke-linecap="round"/><path d="M408 220 L422 230 L408 240" fill="none" stroke="#8aa6c9" stroke-width="5"/>
<g transform="translate(450,130)">
<rect width="300" height="200" rx="18" fill="#fff" stroke="#16a06b" stroke-width="3"/>
<text x="150" y="45" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#16a06b">Memory Location</text>
<rect x="35" y="70" width="230" height="72" rx="10" fill="#ecfaf4"/>
<text x="150" y="100" text-anchor="middle" font-family="Courier New" font-size="18" font-weight="700" fill="#15684b">Address: 0x7FFC</text>
<text x="150" y="127" text-anchor="middle" font-family="Arial" font-size="13" fill="#60748f">example memory address</text>
</g>
<path d="M750 230 H850" stroke="#8aa6c9" stroke-width="6" stroke-linecap="round"/><path d="M838 220 L852 230 L838 240" fill="none" stroke="#8aa6c9" stroke-width="5"/>
<g transform="translate(880,130)">
<rect width="250" height="200" rx="18" fill="#fff" stroke="#ef8b23" stroke-width="3"/>
<text x="125" y="45" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#d87916">Stored Value</text>
<rect x="28" y="70" width="194" height="72" rx="10" fill="#fff4e8"/>
<text x="125" y="104" text-anchor="middle" font-family="Courier New" font-size="24" font-weight="700" fill="#a95709">75</text>
<text x="125" y="129" text-anchor="middle" font-family="Arial" font-size="13" fill="#60748f">binary data is stored in memory</text>
</g>
<text x="600" y="380" text-anchor="middle" font-family="Arial" font-size="15" fill="#526783">Concept: variable name → memory location → stored value. The data type tells the program how to interpret the stored value.</text>
</svg>